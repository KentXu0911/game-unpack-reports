<h3>客户端规则与后台策略的分界</h3>
<div class="data-scroll"><table><thead><tr><th>内容</th><th>解包已提供</th><th>仍需补的证据</th></tr></thead><tbody>
<tr><td>分群、推荐与定价</td><td>输入字段、配置结构与客户端选取分支</td><td>后台赋值公式、人群口径、策略与版本</td></tr>
<tr><td>A/B分流与因果效果</td><td>实验ID、组值消费者和部分版本差异</td><td>分配／曝光记录、观察窗及分组结果数据</td></tr>
<tr><td>订单与交易风控</td><td>客户端购买、验证请求与回调</td><td>服务端核销、反欺诈、并发与对账实现</td></tr>
<tr><td>经营指标</td><td>部分上报调用与事件位置</td><td>有口径的收入、留存、LTV与成本数据</td></tr>
</tbody></table></div>
<p>多账号与长期采样可以约束假设，仍不保证唯一恢复后台模型。实验实现与经营收益分开记录，具体客户端例子见<a href="experiments.html">A/B测试</a>。</p>
