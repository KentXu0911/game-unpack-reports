<p>智能火箭只决定<strong>横向还是竖向</strong>，不挪生成位置。全库直接调用它的只有三处：开局火箭道具放到棋盘上时（<code>BoosterManager.CreateSpecialItem</code>）、Cloche放出火箭时、SlotMachine抛出火箭时。三消四连生成的火箭不走这里，方向由形状决定：竖排四连出横火箭，横排四连出竖火箭，见<a href="fall-rules.html#pattern-search">棋盘状态机</a>。<small>［S1］</small></p>
<p>规则：分别累加生成格所在整行、整列每格对这次攻击的评分，哪边总分高就朝哪边打；两边相等时用关卡随机数在0和1之间取一个，1选竖向，0选横向。评分沿用上面的档位与修正，所以棋子多的一边不一定分高；一个VeryHigh目标就能压过一整列低档目标。</p>
