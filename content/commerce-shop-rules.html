<section id="account-offers"><h3>怎样解释账号当次实际货架</h3>
<p>把同一时点的活动正文与版本、Dynamic／Revenue分组、实验key／value、已购记录和入口状态对齐，再依次检查资格、配置行、优先级与频控。比如某礼包没有出现，可能是活动未开、资源未齐、次数已满，也可能是同入口的其他商品排在前面。</p>
<p>这些输入分工不同：分组决定选哪行内容，实验组决定走哪个版本，商店返回本地化实价。分别见<a href="user-tiers.html">用户分层</a>、<a href="experiments.html">A/B测试</a>与<a href="payment.html">支付及实时价格</a>；商品自身的内容集中在<a href="passes.html">商品类型与奖励</a>。</p></section>
